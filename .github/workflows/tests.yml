name: tests

# The suite needs no API key and no database: the engines are graded against
# hand-computed answers, and the one test that touches the FMP key monkeypatches
# a sentinel rather than reading the real one. So this runs on a clean checkout.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      # main.py lives in backend/, so pytest is invoked from there — conftest.py
      # puts that directory on sys.path.
      - run: python -m pytest tests/ -q
        working-directory: backend
