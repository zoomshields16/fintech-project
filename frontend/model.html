<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Retail Analyst — Model</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* main.shell needed to out-rank .shell's padding shorthand in theme.css */
        main.shell { padding-bottom: 140px; }

        /* ── Company masthead ── */
        .masthead {
            display: flex; align-items: baseline; justify-content: space-between;
            flex-wrap: wrap; gap: 8px 20px;
            padding: 30px 0 18px; margin-bottom: 22px;
            border-bottom: 1px solid var(--line);
        }
        .masthead .name {
            font-family: Georgia, serif; font-size: 25px; font-weight: 700;
            letter-spacing: -0.4px;
        }
        .masthead .price { font-size: 14px; color: var(--muted); }
        .masthead .price b { color: var(--ink); font-weight: 600; }

        /* ── Tables ──
           table-layout: fixed + one shared first-column width keeps the year
           columns vertically aligned across every table on the page. */
        table {
            width: 100%; border-collapse: collapse;
            background: var(--card); font-size: 12.5px;
            border: 1px solid var(--line);
            table-layout: fixed;
        }
        thead th { position: sticky; top: 60px; z-index: 5; }
        th {
            background: var(--navy); color: #fff;
            padding: 8px 10px; text-align: right;
            font-weight: 500; white-space: nowrap; overflow: hidden;
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-variant-numeric: tabular-nums;
        }
        th:first-child {
            text-align: left; width: 250px; white-space: normal;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        td {
            padding: 6px 10px; text-align: right; white-space: nowrap; overflow: hidden;
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-variant-numeric: tabular-nums;
        }
        td:first-child {
            text-align: left; color: var(--ink); white-space: normal;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        th + th { border-left: 1px solid rgba(255,255,255,0.15); }
        td + td { border-left: 1px solid #f2eee5; }

        tr.section-gap td    { padding: 4px 0; border: none; background: var(--paper); }
        tr.subtotal td       { font-weight: 600; border-top: 1px solid #d8d2c4; }
        tr.check-row td      { font-weight: 600; border-top: 2px solid var(--navy); color: var(--navy); }
        tr.section-header td {
            background: var(--paper-2); color: var(--navy);
            font-weight: 700; padding: 6px 12px;
            font-size: 12px; letter-spacing: 0.04em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        tr.sub-header td {
            background: #f7f5ef; color: #3a5578;
            font-weight: 600; padding: 5px 12px; font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        tr.reconcile-row td {
            font-size: 11px; color: var(--faint);
            padding: 4px 12px; background: #fbfaf6;
            border-top: 1px solid #f2eee5; white-space: normal;
        }

        /* ── Supporting schedules: Excel-style formatting ──
           Sub-section labels are plain bold text (no fill), driver inputs are
           boxed, and totals get the accounting top-rule + double underline. */
        .sched tr.sub-header td {
            background: transparent; color: var(--ink);
            font-weight: 700; font-size: 12.5px;
        }
        .sched tr.box-top    td:not(:first-child) { border-top: 1.5px solid var(--ink); }
        .sched tr.box-bottom td:not(:first-child) { border-bottom: 1.5px solid var(--ink); }
        .sched tr.boxed td:nth-child(2) { border-left: 1.5px solid var(--ink); }
        .sched tr.boxed td:last-child   { border-right: 1.5px solid var(--ink); }
        .sched tr.sched-total td { font-weight: 700; }
        .sched tr.sched-total td:not(:first-child) {
            border-top: 1.5px solid var(--ink);
            border-bottom: 3px double var(--ink);
        }

        /* Historical (actual) columns carry the light tint; projected stay plain.
           Supporting schedules (.sched) get no tint at all. */
        table:not(.sched) td:not(:first-child):not(.proj) { background: var(--navy-tint); }
        table:not(.sched) tr.subtotal  td:not(:first-child):not(.proj) { background: var(--navy-tint-2); }
        table:not(.sched) tr.check-row td:not(:first-child):not(.proj) { background: var(--navy-tint-2); }

        .neg  { color: var(--red); }
        .pass { color: var(--green); }
        .fail { color: var(--red); font-weight: 600; }

        /* ── Statement headings ── */
        .statement-label {
            font-family: Georgia, serif;
            font-size: 20px; font-weight: 700; color: var(--ink);
            letter-spacing: -0.3px;
            margin: 30px 0 10px;
        }
        .statement-label.divider {
            font-size: 15px; font-style: italic; font-weight: 400;
            color: var(--muted);
            border-top: 2px solid var(--line);
            padding-top: 26px; margin-top: 44px;
        }

        .error-box { margin-top: 26px; }
    </style>
</head>
<body>

<header class="site-head">
    <div class="shell wide centered">
        <a class="brand" href="index.html">The Retail Analyst<span class="dot">.</span></a>
        <nav class="rail" aria-label="Workflow">
            <a class="rail-step" href="app.html">Assumptions</a>
            <span class="rail-sep"></span>
            <span class="rail-step here">Model</span>
            <span class="rail-sep"></span>
            <a class="rail-step off" id="rail-dcf">DCF</a>
        </nav>
        <div class="head-right">
            <a class="btn small" href="dcf.html" id="dcf-link" style="display:none">Run the DCF →</a>
        </div>
    </div>
</header>

<main class="shell wide">
    <div id="content"></div>
</main>

<script>
    // ── Format helpers ──
    function fmt(val) {
        if (val == null) return '—';
        if (val === 0)   return '$-';
        const b   = val / 1e9;
        const str = '$' + Math.abs(b).toFixed(2) + 'B';
        return val < 0 ? `<span class="neg">(${str})</span>` : str;
    }
    function fmtEps(val) {
        if (val == null) return '—';
        if (val === 0)   return '$-';
        const str = '$' + Math.abs(val).toFixed(2);
        return val < 0 ? `<span class="neg">(${str})</span>` : str;
    }
    function fmtDays(val) {
        if (val == null || val === 0) return '—';
        return String(Math.round(val));
    }
    function fmtPct(val) {
        return val != null ? (val * 100).toFixed(1) + '%' : '—';
    }

    function reconcileSummary(rec) {
        const mis = Object.entries(rec).filter(([, v]) => v !== 'MATCH');
        if (!mis.length) return '<span class="pass">✓ checks pass</span>';
        return mis.map(([k]) => `<span class="fail">✗ ${k}</span>`).join(' ');
    }

    // NOTE: with table-layout: fixed, a colspan larger than the real column
    // count expands the grid and crushes the year columns — so gap() must
    // span exactly the number of columns on the page (set once per render).
    let gapCols = 11;
    function gap() { return `<tr class="section-gap"><td colspan="${gapCols}"></td></tr>`; }

    function tdCls(y) {
        if (!y.projected) return '';
        return y.isSeparator ? ' class="proj proj-sep"' : ' class="proj"';
    }

    function sectionHeader(label, allYears) {
        return `<tr class="section-header"><td colspan="${allYears.length + 1}">${label}</td></tr>`;
    }
    function subHeader(label, allYears) {
        return `<tr class="sub-header"><td colspan="${allYears.length + 1}">${label}</td></tr>`;
    }
    function row(label, key, allYears, formatter, rowCls) {
        const clsName = rowCls === true ? 'subtotal' : rowCls;   // true kept for back-compat
        const cls   = clsName ? ` class="${clsName}"` : '';
        const cells = allYears.map(y => `<td${tdCls(y)}>${formatter(y[key])}</td>`).join('');
        return `<tr${cls}><td>${label}</td>${cells}</tr>`;
    }
    function zeroRow(label, allYears) {
        const cells = allYears.map(y => `<td${tdCls(y)}>$-</td>`).join('');
        return `<tr><td>${label}</td>${cells}</tr>`;
    }

    function buildTable(headerLabel, allYears, bodyHtml) {
        const headerCells = allYears.map(y => {
            const cls   = y.projected ? (y.isSeparator ? ' class="proj proj-sep"' : ' class="proj"') : '';
            const label = y.date.slice(0, 4) + (y.projected ? 'E' : '');
            return `<th${cls}>${label}</th>`;
        }).join('');
        const recCells = allYears.map(y => {
            const content = y.projected ? '' : reconcileSummary(y.reconcile || {});
            return `<td${tdCls(y)}>${content}</td>`;
        }).join('');
        return `
            <div class="table-wrap">
                <table>
                    <thead><tr><th>${headerLabel}</th>${headerCells}</tr></thead>
                    <tbody>
                        ${bodyHtml}
                        <tr class="reconcile-row"><td>Reconciliation</td>${recCells}</tr>
                    </tbody>
                </table>
            </div>`;
    }

    function buildScheduleTable(headerLabel, allYears, bodyHtml) {
        const headerCells = allYears.map(y => {
            const cls   = y.projected ? (y.isSeparator ? ' class="proj proj-sep"' : ' class="proj"') : '';
            const label = y.date.slice(0, 4) + (y.projected ? 'E' : '');
            return `<th${cls}>${label}</th>`;
        }).join('');
        return `
            <div class="table-wrap">
                <table class="sched">
                    <thead><tr><th>${headerLabel}</th>${headerCells}</tr></thead>
                    <tbody>${bodyHtml}</tbody>
                </table>
            </div>`;
    }

    function combineYears(histYears, projYears) {
        const proj = projYears.map((y, i) => ({ ...y, isSeparator: i === 0 }));
        return [...histYears, ...proj];
    }

    // ── Supporting Schedules ──
    function computeSchedules(isAll, cfAll, bsAll) {
        const wcYears = isAll.map((isYr, i) => {
            const bs   = bsAll[i];
            const rev  = isYr.revenue || 0;
            const cogs = Math.abs(isYr.cogs || 0);
            const ar   = bs.accounts_receivable || 0;
            const inv  = bs.inventory           || 0;
            const ap   = bs.accounts_payable    || 0;
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                days_in_period: 365,
                revenue:  rev,
                cogs_neg: -cogs,
                ar, inventory: inv, ap,
                wc_assets: ar + inv,
                wc_liab:   ap,
                nwc:      ar + inv - ap,
                ar_days:  rev  ? ar  / rev  * 365 : null,
                inv_days: cogs ? inv / cogs * 365 : null,
                ap_days:  cogs ? ap  / cogs * 365 : null,
            };
        });
        wcYears.forEach((w, i) => {
            w.change_nwc = i === 0 ? null : wcYears[i - 1].nwc - w.nwc;
        });

        const ppeYears = isAll.map((isYr, i) => {
            const bs = bsAll[i];
            const cf = cfAll[i];
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                revenue:   isYr.revenue || 0,
                beginning: i === 0 ? null : bsAll[i - 1].ppe_net,
                capex_add: Math.abs(cf.capex || 0),
                da_neg:    -(cf.depreciation || 0),
                ending:    bs.ppe_net,
            };
        });

        const ufcfYears = isAll.map((isYr, i) => {
            const cf      = cfAll[i];
            const ebit    = isYr.operating_income || 0;
            const pretax  = isYr.pretax_income    || 0;
            const tax_amt = isYr.income_tax        || 0;
            const tax_rate = pretax > 0 ? tax_amt / pretax : 0;
            const nopat    = ebit * (1 - tax_rate);
            const da       = cf.depreciation || 0;
            const capex    = cf.capex        || 0;
            const dNwc     = wcYears[i].change_nwc;
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                ebit, tax_rate, nopat, da,
                capex,
                change_nwc:  dNwc,
                ufcf_carson: dNwc != null ? nopat + da + capex + dNwc : null,
                ufcf_cf:     cf.free_cash_flow,
            };
        });

        const ratioYears = isAll.map((isYr, i) => {
            const cf     = cfAll[i];
            const rev    = isYr.revenue       || 0;
            const pretax = isYr.pretax_income || 0;
            const tax    = isYr.income_tax     || 0;
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                sbc_pct:     rev ? (cf.stock_comp              || 0) / rev : null,
                da_pct:      rev ? (cf.depreciation            || 0) / rev : null,
                capex_pct:   rev ? Math.abs(cf.capex           || 0) / rev : null,
                tax_rate:    pretax > 0 ? tax / pretax : null,
                buyback_pct: rev ? Math.abs(cf.stock_repurchased || 0) / rev : null,
            };
        });

        return { wcYears, ppeYears, ufcfYears, ratioYears };
    }

    // ── Main render ──
    function render(histData, projData) {
        const isHist = [...histData.income_statement].slice(0, 5).reverse();
        const cfHist = [...histData.cash_flow].slice(0, 5).reverse();
        const bsHist = [...histData.balance_sheet].slice(0, 5).reverse();

        const isAll = projData ? combineYears(isHist, projData.income_statement) : isHist;
        const cfAll = projData ? combineYears(cfHist, projData.cash_flow)        : cfHist;
        const bsAll = projData ? combineYears(bsHist, projData.balance_sheet)    : bsHist;

        gapCols = isAll.length + 1;   // label column + one column per year

        // ── Income Statement ──
        const isBody = `
            ${row('Revenue',                                       'revenue',           isAll, fmt)}
            ${row('Cost of Goods Sold',                           'cogs',              isAll, fmt)}
            ${row('Gross Profit',                                  'gross_profit',      isAll, fmt, true)}
            ${gap()}
            ${row('Selling, General and Administrative',          'sga',               isAll, fmt)}
            ${row('Research and Development',                     'rnd',               isAll, fmt)}
            ${row('Other Operating Expenses',                     'other_opex',        isAll, fmt)}
            ${row('Total Operating Expenses',                     'total_opex',        isAll, fmt, true)}
            ${gap()}
            ${row('Operating Income (EBIT)',                      'operating_income',  isAll, fmt, true)}
            ${gap()}
            ${row('Interest Income',                              'interest_income',   isAll, fmt)}
            ${row('Interest Expense',                             'interest_expense',  isAll, fmt)}
            ${row('Other Income (Expense)',                       'other_income',      isAll, fmt)}
            ${row('Pretax Income',                                'pretax_income',     isAll, fmt, true)}
            ${gap()}
            ${row('Income Tax Expense',                           'income_tax',        isAll, fmt)}
            ${row('Net Income',                                   'net_income',        isAll, fmt, true)}
            ${gap()}
            ${row('Earnings Per Share',                           'eps',               isAll, fmtEps)}
            ${row('Diluted Earnings Per Share',                   'eps_diluted',       isAll, fmtEps)}
        `;

        // ── Cash Flow Statement ──
        const cfBody = `
            ${sectionHeader('OPERATING ACTIVITIES', cfAll)}
            ${row('Net Income',                                        'net_income',            cfAll, fmt)}
            ${row('Depreciation and Amortization',                     'depreciation',          cfAll, fmt)}
            ${row('Stock-Based Compensation',                          'stock_comp',            cfAll, fmt)}
            ${row('Other Adjustments',                                 'other_adjustments',     cfAll, fmt)}
            ${row('Change in Accounts Receivable',                     'change_ar',             cfAll, fmt)}
            ${row('Change in Inventory',                               'change_inventory',      cfAll, fmt)}
            ${zeroRow('Change in Prepaid and Other Current Assets',     cfAll)}
            ${row('Change in Accounts Payable',                        'change_ap',             cfAll, fmt)}
            ${zeroRow('Change in Accrued Expenses',                     cfAll)}
            ${row('Change in Other Working Capital',                   'other_wc',              cfAll, fmt)}
            ${zeroRow('Change in Unearned Revenue',                     cfAll)}
            ${row('Net Cash from Operating Activities',                'operating_cf',          cfAll, fmt, true)}
            ${gap()}
            ${sectionHeader('INVESTING ACTIVITIES', cfAll)}
            ${row('Capital Expenditures',                              'capex',                 cfAll, fmt)}
            ${row('Net Cash from Investing Activities',                'investing_cf',          cfAll, fmt, true)}
            ${gap()}
            ${sectionHeader('FINANCING ACTIVITIES', cfAll)}
            ${row('Share Buy Back',                                    'stock_repurchased',     cfAll, fmt)}
            ${row('Dividends',                                         'dividends_paid',        cfAll, fmt)}
            ${row('Net Cash from Financing Activities',                'financing_cf',          cfAll, fmt, true)}
            ${gap()}
            ${row('Net Change in Cash',                                'net_change_cash',       cfAll, fmt)}
            ${row('Cash at Beginning of Period',                       'cash_beginning',        cfAll, fmt)}
            ${row('Cash at End of Period',                             'cash_end',              cfAll, fmt)}
            ${gap()}
            ${row('Free Cash Flow',                                    'free_cash_flow',        cfAll, fmt, true)}
        `;

        // ── Balance Sheet ──
        const bsBody = `
            ${sectionHeader('ASSETS', bsAll)}
            ${subHeader('Current Assets', bsAll)}
            ${row('Cash and Short-Term Investments',        'cash_st_investments',    bsAll, fmt)}
            ${row('Accounts Receivable',                    'accounts_receivable',    bsAll, fmt)}
            ${row('Inventory',                              'inventory',              bsAll, fmt)}
            ${zeroRow('Prepaid and Other Current Assets',   bsAll)}
            ${row('Other Current Assets',                   'other_current',          bsAll, fmt)}
            ${row('Total Current Assets',                   'total_current_assets',   bsAll, fmt, true)}
            ${gap()}
            ${subHeader('Non-Current Assets', bsAll)}
            ${row('Property, Plant and Equipment (net)',    'ppe_net',                bsAll, fmt)}
            ${row('Goodwill',                               'goodwill',               bsAll, fmt)}
            ${row('Intangible Assets',                      'intangible_assets',      bsAll, fmt)}
            ${row('Long-Term Investments',                  'lt_investments',         bsAll, fmt)}
            ${row('Other Non-Current Assets',               'other_noncurrent',       bsAll, fmt)}
            ${row('Total Non-Current Assets',               'total_noncurrent_assets',bsAll, fmt, true)}
            ${gap()}
            ${row('Total Assets',                           'total_assets',           bsAll, fmt, true)}
            ${gap()}
            ${sectionHeader("LIABILITIES AND SHAREHOLDERS' EQUITY", bsAll)}
            ${subHeader('Current Liabilities', bsAll)}
            ${row('Accounts Payable',                       'accounts_payable',       bsAll, fmt)}
            ${row('Accrued Expenses',                       'accrued_expenses',       bsAll, fmt)}
            ${row('Current Portion of Long-Term Debt',      'current_ltd',            bsAll, fmt)}
            ${row('Other Current Liabilities',              'other_current_liab',     bsAll, fmt)}
            ${row('Total Current Liabilities',              'total_current_liab',     bsAll, fmt, true)}
            ${gap()}
            ${subHeader('Non-Current Liabilities', bsAll)}
            ${row('Long-Term Debt',                         'long_term_debt',         bsAll, fmt)}
            ${row('Deferred Tax Liabilities',               'deferred_tax_liab',      bsAll, fmt)}
            ${row('Other Long-Term Liabilities',            'other_lt_liab',          bsAll, fmt)}
            ${row('Total Non-Current Liabilities',          'total_noncurrent_liab',  bsAll, fmt, true)}
            ${gap()}
            ${row('Total Liabilities',                      'total_liabilities',      bsAll, fmt, true)}
            ${gap()}
            ${subHeader("Shareholders' Equity", bsAll)}
            ${row('Common Stock',                           'common_stock',           bsAll, fmt)}
            ${row('Additional Paid-In Capital',             'apic',                   bsAll, fmt)}
            ${row('Retained Earnings',                      'retained_earnings',      bsAll, fmt)}
            ${row('Treasury Stock',                         'treasury_stock',         bsAll, fmt)}
            ${row('Accumulated OCI',                        'aoci',                   bsAll, fmt)}
            ${row('Other Equity',                           'other_equity',           bsAll, fmt)}
            ${row("Total Shareholders' Equity",             'total_equity',           bsAll, fmt, true)}
            ${gap()}
            ${row("Total Liabilities and Shareholders' Equity", 'total_lae',          bsAll, fmt, true)}
            ${gap()}
            <tr class="check-row">
                <td>Assets − (Liabilities + Equity)</td>
                ${bsAll.map(y => `<td${tdCls(y)}>${fmt(y.check_balance)}</td>`).join('')}
            </tr>
        `;

        // ── Supporting Schedules ──
        const { wcYears, ppeYears, ufcfYears, ratioYears } = computeSchedules(isAll, cfAll, bsAll);

        const wcBody = `
            ${subHeader('Basic Driver', wcYears)}
            ${row('Days in Period',                    'days_in_period', wcYears, fmtDays, 'boxed box-top')}
            ${row('Revenue',                           'revenue',    wcYears, fmt, 'boxed')}
            ${row('COGS',                              'cogs_neg',   wcYears, fmt, 'boxed box-bottom')}
            ${gap()}
            ${subHeader('Amounts Per Day', wcYears)}
            ${row('Accounts Receivable',               'ar_days',    wcYears, fmtDays)}
            ${row('Inventory',                         'inv_days',   wcYears, fmtDays)}
            ${row('Accounts Payable',                  'ap_days',    wcYears, fmtDays)}
            ${gap()}
            ${subHeader('Total Amounts', wcYears)}
            ${row('Accounts Receivable',               'ar',         wcYears, fmt)}
            ${row('Inventory',                         'inventory',  wcYears, fmt)}
            ${row('Accounts Payable',                  'ap',         wcYears, fmt)}
            ${gap()}
            ${subHeader('Net Working Capital', wcYears)}
            ${row('Current Assets',                    'wc_assets',  wcYears, fmt)}
            ${row('Current Liabilities',               'wc_liab',    wcYears, fmt)}
            ${row('Net Working Capital',               'nwc',        wcYears, fmt, true)}
            ${gap()}
            ${row('Cash from Working Capital Items',   'change_nwc', wcYears, fmt, 'sched-total')}
        `;

        const ppeBody = `
            ${row('Revenue',                'revenue',   ppeYears, fmt, 'boxed box-top box-bottom')}
            ${gap()}
            ${subHeader('Plant, Property and Equipment', ppeYears)}
            ${row('Beginning of Period',    'beginning', ppeYears, fmt)}
            ${row('Capital Expenditures',   'capex_add', ppeYears, fmt)}
            ${row('Depreciation Expense',   'da_neg',    ppeYears, fmt)}
            ${row('Net PPE',                'ending',    ppeYears, fmt, 'sched-total')}
        `;

        const depBody = `
            ${row('Depreciation & Amortization',       'da',         ufcfYears,  fmt)}
            ${row('Revenue',                           'ebit',       isAll,      fmt)}
            ${row('D&A as % of Revenue',               'da_pct',     ratioYears, fmtPct, true)}
        `;

        const ufcfBody = `
            ${row('EBIT (Operating Income)',            'ebit',        ufcfYears, fmt)}
            ${row('Effective Tax Rate',                 'tax_rate',    ufcfYears, fmtPct)}
            ${row('NOPAT  =  EBIT × (1 − t)',          'nopat',       ufcfYears, fmt, true)}
            ${gap()}
            ${row('(+) Depreciation & Amortization',   'da',          ufcfYears, fmt)}
            ${row('(+) Capital Expenditures',          'capex',       ufcfYears, fmt)}
            ${row('(±) Change in Net Working Capital', 'change_nwc',  ufcfYears, fmt)}
            ${row('Unlevered FCF  — Carson formula',   'ufcf_carson', ufcfYears, fmt, true)}
            ${gap()}
            ${row('Free Cash Flow  — CF Statement',    'ufcf_cf',     ufcfYears, fmt, true)}
        `;

        const ratioBody = `
            ${row('SBC % of Revenue',                  'sbc_pct',     ratioYears, fmtPct)}
            ${row('D&A % of Revenue',                  'da_pct',      ratioYears, fmtPct)}
            ${row('CapEx % of Revenue',                'capex_pct',   ratioYears, fmtPct)}
            ${row('Effective Tax Rate',                'tax_rate',    ratioYears, fmtPct)}
            ${row('Buyback % of Revenue',              'buyback_pct', ratioYears, fmtPct)}
        `;

        document.getElementById('content').innerHTML = `
            <div class="masthead">
                <span class="name">${histData.company_name} (${histData.ticker})</span>
                <span class="price mono">Current price <b>$${histData.stock_price}</b></span>
            </div>

            <p class="statement-label">Income Statement</p>
            ${buildTable('Income Statement', isAll, isBody)}

            <p class="statement-label">Cash Flow Statement</p>
            ${buildTable('Cash Flow Statement', cfAll, cfBody)}

            <p class="statement-label">Balance Sheet</p>
            ${buildTable('Balance Sheet', bsAll, bsBody)}

            <p class="statement-label divider">Supporting schedules</p>

            <p class="statement-label">1 · Working Capital Driver</p>
            ${buildScheduleTable('Working Capital Driver', wcYears, wcBody)}

            <p class="statement-label">2 · Property, Plant and Equipment</p>
            ${buildScheduleTable('Property, Plant and Equipment', ppeYears, ppeBody)}

            <p class="statement-label">3 · Depreciation Driver</p>
            ${buildScheduleTable('D&A', ufcfYears, depBody)}

            <p class="statement-label">4 · UFCF Build-Up</p>
            ${buildScheduleTable('UFCF', ufcfYears, ufcfBody)}

            <p class="statement-label">5 · Key Ratio Summary</p>
            ${buildScheduleTable('Ratios', ratioYears, ratioBody)}
        `;

        // Enable the DCF step once a projection exists
        if (projData) {
            document.getElementById('dcf-link').style.display = 'inline-block';
            const railDcf = document.getElementById('rail-dcf');
            railDcf.classList.remove('off');
            railDcf.href = 'dcf.html';
        }
    }

    // ── Init ──
    window.addEventListener('load', () => {
        const rawHist = localStorage.getItem('model_hist');
        const rawProj = localStorage.getItem('model_proj');

        if (!rawHist) {
            document.getElementById('content').innerHTML = `
                <div class="error-box">
                    No model data yet. <a href="index.html">Start from the homepage</a> by entering a ticker.
                </div>`;
            return;
        }

        try {
            const histData = JSON.parse(rawHist);
            const projData = rawProj ? JSON.parse(rawProj) : null;
            render(histData, projData);
        } catch (e) {
            document.getElementById('content').innerHTML =
                `<div class="error-box">Error loading data: ${e.message}</div>`;
        }
    });
</script>
</body>
</html>
