<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Retail Analyst — Model</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css?v=27">
    <style>
        /* main.shell needed to out-rank .shell's padding shorthand in theme.css */
        main.shell { padding-bottom: 140px; }

        /* ── Company masthead ── */
        .masthead {
            display: flex; align-items: baseline; justify-content: space-between;
            flex-wrap: wrap; gap: 8px 20px;
            padding: 30px 0 18px; margin-bottom: 22px;
            border-bottom: 1px solid var(--line);
        }
        .masthead .name {
            font-family: var(--font); font-size: 25px; font-weight: 700;
            letter-spacing: -0.4px;
        }
        .masthead .price { font-size: 14px; color: var(--muted); }
        .masthead .price b { color: var(--ink); font-weight: 600; }
        .masthead .meta { display: flex; align-items: center; gap: 18px; }

        /* ── Case switcher ── matches the one on the assumptions page ── */
        .case-tabs {
            display: inline-flex; border: 1px solid var(--line); border-radius: 3px;
            overflow: hidden; background: var(--paper-2);
        }
        .case-tab {
            appearance: none; border: none; cursor: pointer;
            padding: 6px 15px; font-size: 12.5px; font-weight: 500;
            background: transparent; color: var(--muted);
            font-family: var(--font); letter-spacing: 0.02em;
        }
        .case-tab + .case-tab { border-left: 1px solid var(--line); }
        .case-tab:hover { color: var(--ink); }
        .case-tab.is-on { background: var(--blue); color: var(--on-blue); font-weight: 600; }
        .case-tab:focus-visible { outline: 2px solid var(--blue-ink); outline-offset: -2px; }
        /* Shown in the tabs' place when the saved projection predates cases — hiding
           them silently just looks like the feature is missing. */
        .case-hint {
            font-size: 12.5px; color: var(--blue-ink); text-decoration: none;
            border-bottom: 1px solid var(--line); padding-bottom: 1px; white-space: nowrap;
        }
        .case-hint:hover { border-bottom-color: var(--blue-ink); }


        /* ── Tables ──
           table-layout: fixed + one shared first-column width keeps the year
           columns vertically aligned across every table on the page. */
        table {
            width: 100%; border-collapse: collapse;
            background: var(--card); font-size: 12.5px;
            border: 1px solid var(--line);
            table-layout: fixed;
        }
        thead th { position: sticky; top: 60px; z-index: 5; }
        /* Both the year and the figures under it are centred, so they line up on the
           same axis with no optical correction needed — the earlier --year-nudge
           existed only to pull a centred header back over right-aligned figures. */
        th {
            background: var(--blue); color: var(--on-blue);
            padding: 8px 10px;
            text-align: center;
            font-weight: 700; white-space: nowrap; overflow: hidden;
            font-family: var(--font);
            font-variant-numeric: tabular-nums;
            /* Closes the hairline seams between adjacent header cells. With
               table-layout: fixed the column widths land on fractional pixels, so the
               per-cell navy fill leaves sub-pixel gaps that show the page through and
               read as rules between the years. Painting 1px of navy either side makes
               neighbouring cells overlap. Done with a shadow, not a border, because
               collapsed borders and sticky headers do not survive each other. */
            box-shadow: 1px 0 0 0 var(--blue), -1px 0 0 0 var(--blue);
        }
        th:first-child {
            text-align: left; width: 250px; white-space: normal;
            font-family: var(--font);
        }
        td {
            padding: 6px 10px; text-align: center; white-space: nowrap; overflow: hidden;
            font-family: var(--font);
            font-variant-numeric: tabular-nums;
        }
        td:first-child {
            text-align: left; color: var(--ink); white-space: normal;
            font-family: var(--font);
        }

        /* No rules between year columns. The historical/projected tint already
           separates them, and the grid lines were doing the work twice. */

        /* The blank band between categories. `hidden` for the same reason as the
           percent rows — with border-collapse, `none` loses to the table's own
           frame, so these rows were showing a line at each end and reading as a
           thin empty row inside the table instead of a break in it. */
        tr.section-gap td    { padding: 8px 0; border: hidden; background: var(--paper); }
        /* Subtotals are marked by the rule above them, not by weight — the accounting
           convention, and it keeps the figures reading as one column rather than a
           column with half its rows shouting. Losing the bold means the rule has to
           carry the distinction on its own, hence the darker line. */
        tr.subtotal td       { border-top: 1px solid #b9b1a0; }
        tr.check-row td      { font-weight: 600; border-top: 2px solid var(--blue-ink); color: var(--blue-ink); }
        /* Modelling convention: a forecast figure the model never touches — held flat at
           the last actual year — is blue, the way a hard-coded input is blue in a
           spreadsheet. Anything black in a projected column is something the model
           computed: a roll-forward, a driver, or a subtotal. Historical columns are all
           actuals, so the colour would say nothing there and is not applied. */
        tr.hardcoded td.proj { color: var(--blue-input); }
        /* ── Supporting schedules: Excel-style formatting ──
           Sub-section labels are plain bold text (no fill), driver inputs are
           boxed, and totals get the accounting top-rule + double underline. */
        .sched tr.sub-header td {
            background: transparent; color: var(--ink);
            font-weight: 700; font-size: 12.5px;
        }
        .sched tr.box-top    td:not(:first-child) { border-top: 1.5px solid var(--ink); }
        .sched tr.box-bottom td:not(:first-child) { border-bottom: 1.5px solid var(--ink); }
        .sched tr.boxed td:nth-child(2) { border-left: 1.5px solid var(--ink); }
        .sched tr.boxed td:last-child   { border-right: 1.5px solid var(--ink); }
        /* Box drawn around the historical (actual) columns only */
        .sched tr.boxed-hist td:not(:first-child):not(.proj) {
            border-top: 1.5px solid var(--ink);
            border-bottom: 1.5px solid var(--ink);
        }
        .sched tr.boxed-hist td:nth-child(2)          { border-left: 1.5px solid var(--ink); }
        .sched tr.boxed-hist td:not(.proj) + td.proj  { border-left: 1.5px solid var(--ink); }
        .sched tr.boxed-hist td:last-child:not(.proj) { border-right: 1.5px solid var(--ink); }
        /* Bold values (Depreciation Driver % row) */
        .sched tr.bold-vals td:not(:first-child) { font-weight: 700; }
        /* Single-cell average total: value in first data column, ruled + double-underlined */
        .sched tr.avg-row td:nth-child(2) {
            border-top: 1.5px solid var(--ink);
            border-bottom: 3px double var(--ink);
        }

        /* Schedule highlight bands (light gray) */
        .sched tr.tint-hist td:not(:first-child):not(.proj) { background: #ebebe8; }
        .sched tr.tint-proj td.proj                          { background: #ebebe8; }
        .sched tr.tint-all  td:not(:first-child)             { background: #ebebe8; }
        .sched tr.sched-total td { font-weight: 700; }
        .sched tr.sched-total td:not(:first-child) {
            border-top: 1.5px solid var(--ink);
            border-bottom: 3px double var(--ink);
        }

        /* One box around a GROUP of rows, not around each row in it. boxed-hist puts a
           line above and below every row it touches, which is right for a lone driver
           row but turns a stack of three into a grid of cells. These carry the sides
           on every row of the group and the top and bottom only on its first and last
           — the same idea as box-top/boxed/box-bottom, drawn over one half of the year
           axis instead of all of it. */
        .sched tr.grp-hist td:nth-child(2)          { border-left: 1.5px solid var(--ink); }
        .sched tr.grp-hist td:not(.proj) + td.proj  { border-left: 1.5px solid var(--ink); }
        .sched tr.grp-hist td:last-child:not(.proj) { border-right: 1.5px solid var(--ink); }
        .sched tr.grp-hist-top    td:not(:first-child):not(.proj) { border-top: 1.5px solid var(--ink); }
        .sched tr.grp-hist-bottom td:not(:first-child):not(.proj) { border-bottom: 1.5px solid var(--ink); }

        .sched tr.grp-proj td:not(.proj) + td.proj { border-left: 1.5px solid var(--ink); }
        .sched tr.grp-proj td:last-child.proj      { border-right: 1.5px solid var(--ink); }
        .sched tr.grp-proj-top    td.proj { border-top: 1.5px solid var(--ink); }
        .sched tr.grp-proj-bottom td.proj { border-bottom: 1.5px solid var(--ink); }

        /* The accounting rule above a total that sits INSIDE a box — a hairline, so it
           reads as a subtotal rather than as the edge of another box. */
        .sched tr.rule-hist td:not(:first-child):not(.proj) { border-top: 1px solid var(--ink); }
        .sched tr.rule-proj td.proj                          { border-top: 1px solid var(--ink); }

        /* Overrides avg-row's rule + double underline, which reads as a total; Carson
           draws this one as a box around the figure. */
        .sched tr.avg-box td:nth-child(2) { border: 1.5px solid var(--ink); }
        /* One unbroken ground across the whole schedule, with the boxes doing all the
           separating. The page-wide section-gap band paints the darker paper colour to
           split a long statement into parts; here the blocks are already boxed, so that
           band reads as stripes behind them instead. Scoped, because every other table
           on the page still wants the band.

           `border: none`, NOT the `hidden` the base rule uses. Under border-collapse the
           two are not interchangeable: `hidden` wins every conflict, so a gap row sitting
           above a boxed block deletes that block's top edge, and the one below it deletes
           the bottom — the box renders as two bare verticals. `none` loses every conflict
           instead, which is what lets the neighbouring block draw its own edge. */
        .sched.sched-plain tr.section-gap td { background: var(--card); border: none; }
        /* The dotted rule Carson uses to split a schedule's actuals from its forecast.
           Its own row, with a plain gap above it, so the only border it has to win
           against is that gap's `none` — dotted loses to solid in collapse resolution,
           so putting it against a boxed row would silently render it solid. */
        .sched.sched-plain tr.split-row td {
            border: none; border-top: 1px dotted var(--rule-soft, #b9b3a5);
            padding: 0 0 11px;
        }

        /* Historical (actual) columns carry the light tint; projected stay plain.
           Supporting schedules (.sched) get no tint at all. */
        table:not(.sched) td:not(:first-child):not(.proj) { background: var(--blue-tint); }
        table:not(.sched) tr.subtotal  td:not(:first-child):not(.proj) { background: var(--blue-tint-2); }
        table:not(.sched) tr.check-row td:not(:first-child):not(.proj) { background: var(--blue-tint-2); }

        /* ── Statement headings ──
           Three levels, so where one statement ends and the next begins is obvious
           at a glance rather than something you work out by reading the row labels:
             .statement-label  a top-level statement — full rule, generous air
             .divider          the break into the supporting schedules
             .sched-label      one schedule inside that group — indented, no rule */
        .statement-label {
            font-family: var(--font);
            font-size: 23px; font-weight: 700; color: var(--ink);
            letter-spacing: -0.3px;
            border-top: 2px solid var(--blue-ink);
            padding-top: 22px;
            margin: 78px 0 14px;
        }
        /* The first statement follows the masthead rule, so it needs neither a
           second rule nor the full gap. */
        .statement-label:first-of-type {
            border-top: none; padding-top: 0; margin-top: 8px;
        }
        .statement-label.divider {
            font-size: 15px; font-style: italic; font-weight: 400;
            color: var(--muted);
            border-top: 1px solid var(--line);
            padding-top: 26px; margin-top: 86px; margin-bottom: 0;
        }
        .sched-label {
            font-family: var(--font);
            font-size: 17px; font-weight: 700; color: var(--blue-ink);
            letter-spacing: -0.2px;
            margin: 46px 0 10px;
        }

        .error-box { margin-top: 26px; }
    </style>
</head>
<body>

<header class="site-head">
    <div class="shell wide centered">
        <a class="brand" href="index.html">The Retail Analyst<span class="dot">.</span></a>
        <nav class="rail" aria-label="Workflow">
            <a class="rail-step" href="app.html">Assumptions</a>
            <span class="rail-sep"></span>
            <span class="rail-step here">Model</span>
            <span class="rail-sep"></span>
            <a class="rail-step off" id="rail-dcf">DCF</a>
        </nav>
        <div class="head-right">
            <a class="btn small" href="dcf.html" id="dcf-link" style="display:none">Run the DCF →</a>
        </div>
    </div>
</header>

<main class="shell wide">
    <div id="content"></div>
</main>

<script>
    // ── Format helpers ──
    // Negatives are shown in parentheses and nothing else — that IS the accounting
    // convention, and colouring them red as well says the same thing twice on a page
    // where half the cash-flow lines are legitimately negative. The percent-change
    // rows keep their red, because there the colour is the only signal of direction.
    function fmt(val) {
        if (val == null) return '—';
        if (val === 0)   return '$-';
        const b   = val / 1e9;
        const str = '$' + Math.abs(b).toFixed(2) + 'B';
        return val < 0 ? `(${str})` : str;
    }
    function fmtDays(val) {
        if (val == null || val === 0) return '—';
        return String(Math.round(val));
    }
    function fmtPct(val) {
        return val != null ? (val * 100).toFixed(1) + '%' : '—';
    }
    // Interest rates get a second decimal — Carson's schedule reads 5.40% and 14.43%,
    // and at one decimal two years that differ by 12bp print as the same number.
    function fmtRate(val) {
        return val != null ? (val * 100).toFixed(2) + '%' : '—';
    }

    // NOTE: with table-layout: fixed, a colspan larger than the real column
    // count expands the grid and crushes the year columns — so gap() must
    // span exactly the number of columns on the page (set once per render).
    let gapCols = 11;
    function gap() { return `<tr class="section-gap"><td colspan="${gapCols}"></td></tr>`; }
    // Dotted full-width rule — where a schedule stops reporting actuals and starts forecasting.
    function splitRow() { return `<tr class="section-gap split-row"><td colspan="${gapCols}"></td></tr>`; }

    function tdCls(y) {
        if (!y.projected) return '';
        return y.isSeparator ? ' class="proj proj-sep"' : ' class="proj"';
    }

    function sectionHeader(label, allYears) {
        return `<tr class="section-header"><td colspan="${allYears.length + 1}">${label}</td></tr>`;
    }
    function subHeader(label, allYears) {
        return `<tr class="sub-header"><td colspan="${allYears.length + 1}">${label}</td></tr>`;
    }
    function row(label, key, allYears, formatter, rowCls) {
        const clsName = rowCls === true ? 'subtotal' : rowCls;   // true kept for back-compat
        const cls   = clsName ? ` class="${clsName}"` : '';
        const cells = allYears.map(y => `<td${tdCls(y)}>${formatter(y[key])}</td>`).join('');
        return `<tr${cls}><td>${label}</td>${cells}</tr>`;
    }
    // Carson hangs an unlabeled percent-change row directly beneath specific subtotals
    // — Model!27, 34, 38, 44, 48 and 51 on the income statement, 70, 75, 82 and 87 on
    // the cash flow — each one (this year − prior year) / prior year, formatted 0%.
    // The label column stays empty and the first column shown is blank, because the
    // earliest year on screen has no prior year to measure against (his C column is
    // empty for the same reason). The balance sheet carries none of these at all.
    function pctChangeRow(key, allYears) {
        const cells = allYears.map((y, i) => {
            const prev = i > 0 ? allYears[i - 1][key] : null;
            const curr = y[key];
            // A zero or missing prior year has no meaningful percentage against it.
            const pct  = (prev != null && prev !== 0 && curr != null) ? (curr - prev) / prev : null;
            if (pct == null) return `<td${tdCls(y)}></td>`;

            // Rounded before the sign is read, so a change that displays as 0% is not
            // coloured as a move.
            const whole   = Math.round(pct * 100);
            const classes = [];
            if (y.projected)   classes.push('proj');
            if (y.isSeparator) classes.push('proj-sep');
            if (whole > 0)     classes.push('up');
            else if (whole < 0) classes.push('down');
            const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
            // Magnitude only. Green or red is the sign, so printing one as well says
            // it twice — and Math.abs also disposes of JS's "-0".
            return `<td${cls}>${Math.abs(whole)}%</td>`;
        }).join('');
        return `<tr class="pct-row"><td></td>${cells}</tr>`;
    }

    function zeroRow(label, allYears) {
        const cells = allYears.map(y => `<td${tdCls(y)}>$-</td>`).join('');
        return `<tr><td>${label}</td>${cells}</tr>`;
    }
    // Fills historical columns only; projected columns stay blank.
    function histRow(label, key, allYears, formatter, rowCls) {
        const cls   = rowCls ? ` class="${rowCls}"` : '';
        const cells = allYears.map(y =>
            `<td${tdCls(y)}>${y.projected ? '' : formatter(y[key])}</td>`).join('');
        return `<tr${cls}><td>${label}</td>${cells}</tr>`;
    }
    // Fills projected columns only; historical columns stay blank. The mirror of
    // histRow, for the forecast half of a schedule that shows both (Model!G285:K291).
    function projRow(label, key, allYears, formatter, rowCls) {
        const cls   = rowCls ? ` class="${rowCls}"` : '';
        const cells = allYears.map(y =>
            `<td${tdCls(y)}>${y.projected ? formatter(y[key]) : ''}</td>`).join('');
        return `<tr${cls}><td>${label}</td>${cells}</tr>`;
    }
    // Single value shown in the first data column only (e.g. "average 3 years").
    function avgRow(label, value, allYears, formatter, rowCls) {
        const cells = allYears.map((y, i) =>
            `<td${tdCls(y)}>${i === 0 ? formatter(value) : ''}</td>`).join('');
        return `<tr class="avg-row${rowCls ? ' ' + rowCls : ''}"><td>${label}</td>${cells}</tr>`;
    }

    function buildTable(headerLabel, allYears, bodyHtml) {
        const headerCells = allYears.map(y => {
            const cls   = y.projected ? (y.isSeparator ? ' class="proj proj-sep"' : ' class="proj"') : '';
            const label = y.date.slice(0, 4) + (y.projected ? 'E' : '');
            return `<th${cls}>${label}</th>`;
        }).join('');
        // No per-year reconciliation row here. Every statement still carries its
        // `reconcile` block in the API response and the checks still run on every
        // fetch — status.html is where they are read, across all 101 companies at
        // once, which is a far better view of them than one row per table.
        return `
            <div class="table-wrap">
                <table>
                    <thead><tr><th>${headerLabel}</th>${headerCells}</tr></thead>
                    <tbody>${bodyHtml}</tbody>
                </table>
            </div>`;
    }

    // fullYearCount lets a schedule show fewer year columns than the rest of the
    // page while keeping each column the same width — the table ends early and
    // leaves blank space to the right instead of stretching to fill the row.
    function buildScheduleTable(headerLabel, allYears, bodyHtml, fullYearCount, tableCls) {
        const total = fullYearCount || allYears.length;
        const widthStyle = total !== allYears.length
            ? ` style="width: calc(250px + (100% - 250px) * ${allYears.length} / ${total});"`
            : '';
        const headerCells = allYears.map(y => {
            const cls   = y.projected ? (y.isSeparator ? ' class="proj proj-sep"' : ' class="proj"') : '';
            const label = y.date.slice(0, 4) + (y.projected ? 'E' : '');
            return `<th${cls}>${label}</th>`;
        }).join('');
        return `
            <div class="table-wrap">
                <table class="sched${tableCls ? ' ' + tableCls : ''}"${widthStyle}>
                    <thead><tr><th>${headerLabel}</th>${headerCells}</tr></thead>
                    <tbody>${bodyHtml}</tbody>
                </table>
            </div>`;
    }

    function combineYears(histYears, projYears) {
        const proj = projYears.map((y, i) => ({ ...y, isSeparator: i === 0 }));
        return [...histYears, ...proj];
    }

    // ── Supporting Schedules ──
    // Carson's interest-bearing debt schedule (Model!B267:K291). The figures come
    // down from the API already computed — the rate this schedule implies is what
    // prices the forecast's interest expense, so the page reads it rather than
    // deriving a second opinion of its own. All this does is line the API's rows up
    // with the year columns already on screen.
    function interestYears(isAll) {
        const sch = projData && projData.interest_schedule;
        if (!sch) return null;
        const byYear = r => [String(r.year), r];
        const hist = Object.fromEntries(sch.history.map(byYear));
        const fcst = Object.fromEntries(sch.forecast.map(byYear));
        return isAll.map(y => {
            const key = String(y.date).slice(0, 4);
            const r   = (y.projected ? fcst[key] : hist[key]) || {};
            return {
                date: y.date, projected: y.projected, isSeparator: y.isSeparator,
                current_ltd:    r.current_ltd,
                long_term_debt: r.long_term_debt,
                total_debt:     r.total_debt,
                // Carson writes the cost as a negative; our statements carry it as a
                // positive the pretax line subtracts. Same figure, his sign.
                interest_expense: r.interest_expense != null ? -r.interest_expense : null,
                effective_rate: r.effective_rate,
                average_rate:   sch.average_rate,
            };
        });
    }

    function computeSchedules(isAll, cfAll, bsAll) {
        const wcYears = isAll.map((isYr, i) => {
            const bs   = bsAll[i];
            const rev  = isYr.revenue || 0;
            const cogs = Math.abs(isYr.cogs || 0);
            const ar   = bs.accounts_receivable || 0;
            const inv  = bs.inventory           || 0;
            const ap   = bs.accounts_payable    || 0;
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                days_in_period: 365,
                revenue:  rev,
                cogs_neg: -cogs,
                ar, inventory: inv, ap,
                wc_assets: ar + inv,
                wc_liab:   ap,
                nwc:      ar + inv - ap,
                ar_days:  rev  ? ar  / rev  * 365 : null,
                inv_days: cogs ? inv / cogs * 365 : null,
                ap_days:  cogs ? ap  / cogs * 365 : null,
            };
        });
        wcYears.forEach((w, i) => {
            w.change_nwc = i === 0 ? null : wcYears[i - 1].nwc - w.nwc;
        });

        const ppeYears = isAll.map((isYr, i) => {
            const bs = bsAll[i];
            const cf = cfAll[i];
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                revenue:   isYr.revenue || 0,
                beginning: i === 0 ? null : bsAll[i - 1].ppe_net,
                capex_add: Math.abs(cf.capex || 0),
                da_neg:    -(cf.depreciation || 0),
                ending:    bs.ppe_net,
            };
        });

        const ufcfYears = isAll.map((isYr, i) => {
            const cf      = cfAll[i];
            const ebit    = isYr.operating_income || 0;
            const pretax  = isYr.pretax_income    || 0;
            const tax_amt = isYr.income_tax        || 0;
            const tax_rate = pretax > 0 ? tax_amt / pretax : 0;
            const nopat    = ebit * (1 - tax_rate);
            const da       = cf.depreciation || 0;
            const capex    = cf.capex        || 0;
            const dNwc     = wcYears[i].change_nwc;
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                ebit, tax_rate, nopat, da,
                capex,
                change_nwc:  dNwc,
                ufcf_carson: dNwc != null ? nopat + da + capex + dNwc : null,
                ufcf_cf:     cf.free_cash_flow,
            };
        });

        const ratioYears = isAll.map((isYr, i) => {
            const cf     = cfAll[i];
            const rev    = isYr.revenue       || 0;
            const pretax = isYr.pretax_income || 0;
            const tax    = isYr.income_tax     || 0;
            return {
                date: isYr.date, projected: isYr.projected, isSeparator: isYr.isSeparator,
                sbc_pct:     rev ? (cf.stock_comp              || 0) / rev : null,
                da_pct:      rev ? (cf.depreciation            || 0) / rev : null,
                capex_pct:   rev ? Math.abs(cf.capex           || 0) / rev : null,
                tax_rate:    pretax > 0 ? tax / pretax : null,
                buyback_pct: rev ? Math.abs(cf.stock_repurchased || 0) / rev : null,
            };
        });

        return { wcYears, ppeYears, ufcfYears, ratioYears };
    }

    // ── Cases ──
    // The projection response carries one entry per case when the assumptions page
    // sent them; an older cached response is a single projection with no `cases` key,
    // and still renders — as one case, with no switcher.
    const CASES       = ['best', 'base', 'worst'];
    const CASE_LABELS = { best: 'Best', base: 'Base', worst: 'Worst' };
    let   histData = null, projData = null, caseNow = 'base';

    function caseNames() {
        if (!projData || !projData.cases) return [];
        return CASES.filter(c => projData.cases[c]);
    }
    function caseData(name) {
        if (!projData) return null;
        return projData.cases ? projData.cases[name] : projData;
    }

    // The DCF values whatever is on screen, so switching the case here rewrites the
    // hand-off. Leaving it pointing at the previous case is the failure that matters:
    // the DCF page would show a valuation the model page is no longer displaying.
    function syncDcfInput() {
        const sel = caseData(caseNow);
        if (!sel) return;
        let input;
        try { input = JSON.parse(localStorage.getItem('dcf_input')); } catch { return; }
        if (!input) return;
        input.case = caseNow;
        input.ufcf = sel.ufcf;
        input.proj_years = sel.income_statement.map(y => y.date.slice(0, 4));
        localStorage.setItem('dcf_input', JSON.stringify(input));
        localStorage.setItem('model_case', caseNow);
    }

    function switchCase(name) {
        if (name === caseNow || !caseData(name)) return;
        caseNow = name;
        syncDcfInput();
        render();
        window.scrollTo({ top: 0 });
    }

    function caseTabs(names) {
        const tabs = names.map(name =>
            `<button type="button" class="case-tab${name === caseNow ? ' is-on' : ''}"
                     role="tab" aria-selected="${name === caseNow}"
                     data-case="${name}">${CASE_LABELS[name]}</button>`).join('');
        return `<div class="case-tabs" role="tablist" aria-label="Case">${tabs}</div>`;
    }

    // ── Main render ──
    function render() {
        const isHist = [...histData.income_statement].slice(0, 5).reverse();
        const cfHist = [...histData.cash_flow].slice(0, 5).reverse();
        const bsHist = [...histData.balance_sheet].slice(0, 5).reverse();

        const proj  = caseData(caseNow);
        const isAll = proj ? combineYears(isHist, proj.income_statement) : isHist;
        const cfAll = proj ? combineYears(cfHist, proj.cash_flow)        : cfHist;
        const bsAll = proj ? combineYears(bsHist, proj.balance_sheet)    : bsHist;

        gapCols = isAll.length + 1;   // label column + one column per year

        // ── Income Statement ──
        const isBody = `
            ${row('Revenue',                                       'revenue',           isAll, fmt)}
            ${row('Cost of Goods Sold',                           'cogs',              isAll, fmt)}
            ${row('Gross Profit',                                  'gross_profit',      isAll, fmt, true)}
            ${pctChangeRow('gross_profit', isAll)}
            ${gap()}
            ${row('Selling, General and Administrative',          'sga',               isAll, fmt)}
            ${row('Research and Development',                     'rnd',               isAll, fmt)}
            ${row('Other Operating Expenses',                     'other_opex',        isAll, fmt)}
            ${row('Total Operating Expenses',                     'total_opex',        isAll, fmt, true)}
            ${gap()}
            ${row('Operating Income (EBIT)',                      'operating_income',  isAll, fmt, true)}
            ${pctChangeRow('operating_income', isAll)}
            ${gap()}
            ${row('Interest Income',                              'interest_income',   isAll, fmt)}
            ${row('Interest Expense',                             'interest_expense',  isAll, fmt)}
            ${row('Other Income (Expense)',                       'other_income',      isAll, fmt)}
            ${row('Pretax Income',                                'pretax_income',     isAll, fmt, true)}
            ${pctChangeRow('pretax_income', isAll)}
            ${gap()}
            ${row('Income Tax Expense',                           'income_tax',        isAll, fmt)}
            ${pctChangeRow('income_tax', isAll)}
            ${gap()}
            ${row('Net Income',                                   'net_income',        isAll, fmt, true)}
            ${pctChangeRow('net_income', isAll)}
        `;

        // ── Cash Flow Statement ──
        const cfBody = `
            ${sectionHeader('OPERATING ACTIVITIES', cfAll)}
            ${row('Net Income',                                        'net_income',            cfAll, fmt)}
            ${row('Depreciation and Amortization',                     'depreciation',          cfAll, fmt)}
            ${row('Stock-Based Compensation',                          'stock_comp',            cfAll, fmt)}
            ${row('Other Adjustments',                                 'other_adjustments',     cfAll, fmt)}
            ${row('Change in Accounts Receivable',                     'change_ar',             cfAll, fmt)}
            ${row('Change in Inventory',                               'change_inventory',      cfAll, fmt)}
            ${zeroRow('Change in Prepaid and Other Current Assets',     cfAll)}
            ${row('Change in Accounts Payable',                        'change_ap',             cfAll, fmt)}
            ${zeroRow('Change in Accrued Expenses',                     cfAll)}
            ${row('Change in Other Working Capital',                   'other_wc',              cfAll, fmt)}
            ${zeroRow('Change in Unearned Revenue',                     cfAll)}
            ${row('Net Cash from Operating Activities',                'operating_cf',          cfAll, fmt, true)}
            ${pctChangeRow('operating_cf', cfAll)}
            ${gap()}
            ${sectionHeader('INVESTING ACTIVITIES', cfAll)}
            ${row('Capital Expenditures',                              'capex',                 cfAll, fmt)}
            ${row('Net Cash from Investing Activities',                'investing_cf',          cfAll, fmt, true)}
            ${pctChangeRow('investing_cf', cfAll)}
            ${gap()}
            ${sectionHeader('FINANCING ACTIVITIES', cfAll)}
            ${row('Share Buy Back',                                    'stock_repurchased',     cfAll, fmt)}
            ${row('Dividends',                                         'dividends_paid',        cfAll, fmt)}
            ${row('Net Cash from Financing Activities',                'financing_cf',          cfAll, fmt, true)}
            ${pctChangeRow('financing_cf', cfAll)}
            ${gap()}
            ${row('Net Change in Cash',                                'net_change_cash',       cfAll, fmt)}
            ${row('Cash at Beginning of Period',                       'cash_beginning',        cfAll, fmt)}
            ${row('Cash at End of Period',                             'cash_end',              cfAll, fmt)}
            ${gap()}
            ${row('Free Cash Flow',                                    'free_cash_flow',        cfAll, fmt, true)}
            ${pctChangeRow('free_cash_flow', cfAll)}
        `;

        // ── Balance Sheet ──
        const bsBody = `
            ${sectionHeader('ASSETS', bsAll)}
            ${subHeader('Current Assets', bsAll)}
            ${row('Cash and Short-Term Investments',        'cash_st_investments',    bsAll, fmt)}
            ${row('Accounts Receivable',                    'accounts_receivable',    bsAll, fmt)}
            ${row('Inventory',                              'inventory',              bsAll, fmt)}
            ${zeroRow('Prepaid and Other Current Assets',   bsAll)}
            ${row('Other Current Assets',                   'other_current',          bsAll, fmt, 'hardcoded')}
            ${row('Total Current Assets',                   'total_current_assets',   bsAll, fmt, true)}
            ${gap()}
            ${subHeader('Non-Current Assets', bsAll)}
            ${row('Property, Plant and Equipment (net)',    'ppe_net',                bsAll, fmt)}
            ${row('Goodwill',                               'goodwill',               bsAll, fmt, 'hardcoded')}
            ${row('Intangible Assets',                      'intangible_assets',      bsAll, fmt, 'hardcoded')}
            ${row('Long-Term Investments',                  'lt_investments',         bsAll, fmt, 'hardcoded')}
            ${row('Other Non-Current Assets',               'other_noncurrent',       bsAll, fmt, 'hardcoded')}
            ${row('Total Non-Current Assets',               'total_noncurrent_assets',bsAll, fmt, true)}
            ${gap()}
            ${row('Total Assets',                           'total_assets',           bsAll, fmt, true)}
            ${gap()}
            ${sectionHeader("LIABILITIES AND SHAREHOLDERS' EQUITY", bsAll)}
            ${subHeader('Current Liabilities', bsAll)}
            ${row('Accounts Payable',                       'accounts_payable',       bsAll, fmt)}
            ${row('Accrued Expenses',                       'accrued_expenses',       bsAll, fmt, 'hardcoded')}
            ${row('Current Portion of Long-Term Debt',      'current_ltd',            bsAll, fmt, 'hardcoded')}
            ${row('Other Current Liabilities',              'other_current_liab',     bsAll, fmt, 'hardcoded')}
            ${row('Total Current Liabilities',              'total_current_liab',     bsAll, fmt, true)}
            ${gap()}
            ${subHeader('Non-Current Liabilities', bsAll)}
            ${row('Long-Term Debt',                         'long_term_debt',         bsAll, fmt, 'hardcoded')}
            ${row('Deferred Tax Liabilities',               'deferred_tax_liab',      bsAll, fmt, 'hardcoded')}
            ${row('Other Long-Term Liabilities',            'other_lt_liab',          bsAll, fmt, 'hardcoded')}
            ${row('Total Non-Current Liabilities',          'total_noncurrent_liab',  bsAll, fmt, true)}
            ${gap()}
            ${row('Total Liabilities',                      'total_liabilities',      bsAll, fmt, true)}
            ${gap()}
            ${subHeader("Shareholders' Equity", bsAll)}
            ${row('Common Stock',                           'common_stock',           bsAll, fmt, 'hardcoded')}
            ${row('Additional Paid-In Capital',             'apic',                   bsAll, fmt, 'hardcoded')}
            ${row('Retained Earnings',                      'retained_earnings',      bsAll, fmt)}
            ${row('Treasury Stock',                         'treasury_stock',         bsAll, fmt)}
            ${row('Accumulated OCI',                        'aoci',                   bsAll, fmt, 'hardcoded')}
            ${row('Other Equity',                           'other_equity',           bsAll, fmt)}
            ${row("Total Shareholders' Equity",             'total_equity',           bsAll, fmt, true)}
            ${gap()}
            ${row("Total Liabilities and Shareholders' Equity", 'total_lae',          bsAll, fmt, true)}
            ${gap()}
            <tr class="check-row">
                <td>Assets − (Liabilities + Equity)</td>
                ${bsAll.map(y => `<td${tdCls(y)}>${fmt(y.check_balance)}</td>`).join('')}
            </tr>
        `;

        // ── Supporting Schedules ──
        const { wcYears, ppeYears, ufcfYears, ratioYears } = computeSchedules(isAll, cfAll, bsAll);

        const wcBody = `
            ${subHeader('Basic Driver', wcYears)}
            ${row('Days in Period',                    'days_in_period', wcYears, fmtDays, 'boxed box-top')}
            ${row('Revenue',                           'revenue',    wcYears, fmt, 'boxed')}
            ${row('COGS',                              'cogs_neg',   wcYears, fmt, 'boxed box-bottom')}
            ${gap()}
            ${subHeader('Amounts Per Day', wcYears)}
            ${row('Accounts Receivable',               'ar_days',    wcYears, fmtDays, 'tint-hist')}
            ${row('Inventory',                         'inv_days',   wcYears, fmtDays, 'tint-hist')}
            ${row('Accounts Payable',                  'ap_days',    wcYears, fmtDays, 'tint-hist')}
            ${gap()}
            ${subHeader('Total Amounts', wcYears)}
            ${row('Accounts Receivable',               'ar',         wcYears, fmt, 'tint-proj')}
            ${row('Inventory',                         'inventory',  wcYears, fmt, 'tint-proj')}
            ${row('Accounts Payable',                  'ap',         wcYears, fmt, 'tint-proj')}
            ${gap()}
            ${subHeader('Net Working Capital', wcYears)}
            ${row('Current Assets',                    'wc_assets',  wcYears, fmt, 'tint-all')}
            ${row('Current Liabilities',               'wc_liab',    wcYears, fmt, 'tint-all')}
            ${row('Net Working Capital',               'nwc',        wcYears, fmt, 'subtotal tint-all')}
            ${gap()}
            ${row('Cash from Working Capital Items',   'change_nwc', wcYears, fmt, 'sched-total')}
        `;

        const ppeBody = `
            ${gap()}
            ${row('Revenue',                'revenue',   ppeYears, fmt, 'boxed-hist')}
            ${gap()}
            ${subHeader('Plant, Property and Equipment', ppeYears)}
            ${row('Beginning of Period',    'beginning', ppeYears, fmt, 'tint-proj')}
            ${row('Capital Expenditures',   'capex_add', ppeYears, fmt, 'tint-proj')}
            ${row('Depreciation Expense',   'da_neg',    ppeYears, fmt, 'tint-proj')}
            ${row('Net PPE',                'ending',    ppeYears, fmt, 'sched-total tint-proj')}
        `;

        // Depreciation Driver shows historical years only — its columns are sized
        // to match the full-width schedules so they still line up (see fullYearCount).
        const depYears  = ratioYears.filter(y => !y.projected);
        const depGap    = `<tr class="section-gap"><td colspan="${depYears.length + 1}"></td></tr>`;
        const histDaPct = depYears.filter(y => y.da_pct != null).map(y => y.da_pct);
        const last3     = histDaPct.slice(-3);
        const depAvg3   = last3.length ? last3.reduce((a, b) => a + b, 0) / last3.length : null;

        const depBody = `
            ${depGap}
            ${row('Depreciation as a % of Revenue', 'da_pct', depYears, fmtPct, 'boxed-hist tint-hist bold-vals')}
            ${depGap}
            ${avgRow('average 3 years', depAvg3, depYears, fmtPct)}
        `;

        // ── 4 · Interest-Bearing Debt (Model!B267:K291) ──
        // Carson's block order, top to bottom: the debt build, the debt against the
        // interest it cost, the rate that implies, the three-year average of it, then
        // the same build for the forecast priced at that average.
        const intYears = interestYears(isAll);
        const intAvg   = intYears ? intYears[0].average_rate : null;
        const intBody  = intYears ? `
            ${gap()}
            ${histRow('Current Portion of Long-Term Debt', 'current_ltd',    intYears, fmt, 'grp-hist grp-hist-top')}
            ${histRow('Long-Term Debt',                    'long_term_debt', intYears, fmt, 'grp-hist')}
            ${histRow('Total Interest-Bearing Debt',       'total_debt',     intYears, fmt, 'grp-hist grp-hist-bottom rule-hist bold-vals')}
            ${gap()}
            ${histRow('Total Interest-Bearing Debt',       'total_debt',       intYears, fmt, 'grp-hist grp-hist-top')}
            ${histRow('Interest Expense',                  'interest_expense', intYears, fmt, 'grp-hist grp-hist-bottom')}
            ${gap()}
            ${histRow('Effective Interest Rate (Interest ÷ Debt)', 'effective_rate', intYears, fmtRate, 'grp-hist grp-hist-top grp-hist-bottom')}
            ${gap()}
            ${avgRow('3 Year Average Rate', intAvg, intYears, fmtRate, 'avg-box bold-vals')}
            ${gap()}
            ${splitRow()}
            ${projRow('Current Portion of Long-Term Debt', 'current_ltd',    intYears, fmt, 'grp-proj grp-proj-top')}
            ${projRow('Long-Term Debt',                    'long_term_debt', intYears, fmt, 'grp-proj')}
            ${projRow('Total Interest-Bearing Debt',       'total_debt',     intYears, fmt, 'grp-proj grp-proj-bottom rule-proj bold-vals')}
            ${gap()}
            ${projRow('Interest-Bearing Debt',             'total_debt',     intYears, fmt, 'grp-proj grp-proj-top')}
            ${projRow('3 Year Average Rate',               'average_rate',   intYears, fmtRate, 'grp-proj bold-vals')}
            ${projRow('Interest Expense (Debt × Rate)',    'interest_expense', intYears, fmt, 'grp-proj grp-proj-bottom rule-proj')}
        ` : '';

        const ufcfBody = `
            ${gap()}
            ${row('EBIT × (1 − Tax Rate)',              'nopat',       ufcfYears, fmt, 'boxed box-top')}
            ${row('Depreciation and Amortization',      'da',          ufcfYears, fmt, 'boxed')}
            ${row('Less: Capital Expenditures',         'capex',       ufcfYears, fmt, 'boxed')}
            ${row('Less: Change in Net Working Capital','change_nwc',  ufcfYears, fmt, 'boxed box-bottom')}
            ${gap()}
            ${row('Unlevered Free Cash Flow',           'ufcf_carson', ufcfYears, fmt, 'sched-total')}
        `;


        const names = caseNames();

        document.getElementById('content').innerHTML = `
            <div class="masthead">
                <span class="name">${histData.company_name} (${histData.ticker})</span>
                <div class="meta">
                    <span class="price mono">Current price <b>$${histData.stock_price}</b></span>
                    ${names.length > 1 ? caseTabs(names)
                      : '<a class="case-hint" href="app.html">Re-run the projection to compare cases →</a>'}
                </div>
            </div>

            <p class="statement-label">Income Statement</p>
            ${buildTable('Income Statement', isAll, isBody)}

            <p class="statement-label">Cash Flow Statement</p>
            ${buildTable('Cash Flow Statement', cfAll, cfBody)}

            <p class="statement-label">Balance Sheet</p>
            ${buildTable('Balance Sheet', bsAll, bsBody)}

            <p class="statement-label divider">Supporting schedules</p>

            <p class="sched-label">1 · Working Capital Driver</p>
            ${buildScheduleTable('Working Capital Driver', wcYears, wcBody)}

            <p class="sched-label">2 · Property, Plant and Equipment</p>
            ${buildScheduleTable('Property, Plant and Equipment', ppeYears, ppeBody)}

            <p class="sched-label">3 · Depreciation Driver</p>
            ${buildScheduleTable('Depreciation Driver', depYears, depBody, gapCols - 1)}

            ${intBody ? `<p class="sched-label">4 · Interest-Bearing Debt</p>
            ${buildScheduleTable('Interest-Bearing Debt', intYears, intBody, null, 'sched-plain')}` : ''}

            <p class="sched-label">${intBody ? '5' : '4'} · UFCF Build-Up</p>
            ${buildScheduleTable('UFCF', ufcfYears, ufcfBody)}
        `;

        // The tabs live inside the markup that was just replaced, so they are wired
        // on every render rather than once at load.
        document.querySelectorAll('.case-tab').forEach(tab =>
            tab.addEventListener('click', () => switchCase(tab.dataset.case)));

        // Enable the DCF step once a projection exists
        if (projData) {
            document.getElementById('dcf-link').style.display = 'inline-block';
            const railDcf = document.getElementById('rail-dcf');
            railDcf.classList.remove('off');
            railDcf.href = 'dcf.html';
        }
    }

    // ── Init ──
    window.addEventListener('load', () => {
        const rawHist = localStorage.getItem('model_hist');
        const rawProj = localStorage.getItem('model_proj');

        if (!rawHist) {
            document.getElementById('content').innerHTML = `
                <div class="error-box">
                    No model data yet. <a href="index.html">Start from the homepage</a> by entering a ticker.
                </div>`;
            return;
        }

        try {
            histData = JSON.parse(rawHist);
            projData = rawProj ? JSON.parse(rawProj) : null;

            // Come back to this page and it reopens on the case you left it on.
            const saved = localStorage.getItem('model_case');
            caseNow = (saved && caseData(saved)) ? saved : 'base';

            render();
        } catch (e) {
            document.getElementById('content').innerHTML =
                `<div class="error-box">Error loading data: ${e.message}</div>`;
        }
    });
</script>
</body>
</html>
