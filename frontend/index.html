<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valuation Model</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h1 { color: #1a1a1a; }
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        #results { margin-top: 30px; display: none; }

        .company-header {
            background: white;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .company-header .name { font-size: 18px; font-weight: 600; }
        .company-header .price { font-size: 16px; color: #555; }

        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 6px;
            overflow: hidden;
            font-size: 13px;
        }
        th {
            background: #1e3a5f;
            color: white;
            padding: 8px 12px;
            text-align: right;
            font-weight: 500;
            white-space: nowrap;
        }
        th:first-child { text-align: left; min-width: 220px; }
        td {
            padding: 7px 12px;
            text-align: right;
            white-space: nowrap;
        }
        td:first-child { text-align: left; color: #333; }

        /* section dividers */
        tr.section-gap td { padding: 4px 0; border: none; background: #f5f5f5; }

        /* subtotal rows */
        tr.subtotal td { font-weight: 600; border-top: 1px solid #ddd; }

        /* negative numbers */
        .neg { color: #dc2626; }

        /* section headers inside table */
        tr.section-header td {
            background: #e8eef5;
            color: #1e3a5f;
            font-weight: 700;
            padding: 6px 12px;
            font-size: 12px;
            letter-spacing: 0.04em;
        }
        tr.sub-header td {
            background: #f4f7fa;
            color: #2d4a6e;
            font-weight: 600;
            padding: 5px 12px;
            font-size: 12px;
        }
        tr.check-row td {
            font-weight: 600;
            border-top: 2px solid #1e3a5f;
            color: #1e3a5f;
        }

        /* reconcile row */
        tr.reconcile-row td {
            font-size: 11px;
            color: #aaa;
            padding: 4px 12px;
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
            white-space: normal;
        }

        /* subtle column separator on data columns */
        th + th { border-left: 1px solid rgba(255,255,255,0.15); }
        td + td { border-left: 1px solid #f0f0f0; }
        .pass { color: #16a34a; }
        .fail { color: #dc2626; font-weight: 600; }

        .statement-label {
            font-size: 15px;
            font-weight: 600;
            color: #1e3a5f;
            margin: 24px 0 8px 0;
        }

        .error-box {
            background: #fee2e2;
            color: #dc2626;
            padding: 16px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<h1>Valuation Model</h1>
<p>Enter a stock ticker to run the model.</p>
<div class="input-row">
    <input type="text" id="ticker" placeholder="e.g. AAPL">
    <button id="run-btn">Run Model</button>
</div>

<div id="results"></div>

<script>
    function reconcileSummary(rec) {
        const mismatches = Object.entries(rec).filter(([, v]) => v !== 'MATCH');
        if (mismatches.length === 0) return '<span class="pass">✓ checks pass</span>';
        return mismatches.map(([k, v]) => `<span class="fail">✗ ${k}</span>`).join(' ');
    }

    function fmt(val) {
        if (val == null) return '—';
        if (val === 0) return '$-';
        const b = val / 1e9;
        const str = '$' + Math.abs(b).toFixed(2) + 'B';
        return val < 0 ? `<span class="neg">(${str})</span>` : str;
    }

    function fmtEps(val) {
        if (val == null) return '—';
        if (val === 0) return '$-';
        const str = '$' + Math.abs(val).toFixed(2);
        return val < 0 ? `<span class="neg">(${str})</span>` : str;
    }

    function gap() {
        return '<tr class="section-gap"><td colspan="999"></td></tr>';
    }

    function sectionHeader(label, colCount) {
        return `<tr class="section-header"><td colspan="${colCount + 1}">${label}</td></tr>`;
    }

    function row(label, key, years, formatter, isSubtotal) {
        const cls = isSubtotal ? ' class="subtotal"' : '';
        const cells = years.map(y => `<td>${formatter(y[key])}</td>`).join('');
        return `<tr${cls}><td>${label}</td>${cells}</tr>`;
    }

    function zeroRow(label, colCount) {
        const cells = Array(colCount).fill('<td>$-</td>').join('');
        return `<tr><td>${label}</td>${cells}</tr>`;
    }

    function subHeader(label, colCount) {
        return `<tr class="sub-header"><td colspan="${colCount + 1}">${label}</td></tr>`;
    }

    function buildTable(ticker, headerLabel, years, bodyHtml, reconcileHtml) {
        const headerCells = years.map(y => `<th>${y.date.slice(0, 4)}</th>`).join('');
        return `
            <div class="table-wrap">
                <table>
                    <thead><tr><th>${headerLabel}</th>${headerCells}</tr></thead>
                    <tbody>
                        ${bodyHtml}
                        <tr class="reconcile-row"><td>Reconciliation</td>${reconcileHtml}</tr>
                    </tbody>
                </table>
            </div>`;
    }

    document.getElementById('run-btn').addEventListener('click', async () => {
        const ticker = document.getElementById('ticker').value.trim().toUpperCase();
        const resultsBox = document.getElementById('results');

        if (!ticker) { alert('Please enter a ticker'); return; }

        resultsBox.style.display = 'block';
        resultsBox.innerHTML = '<p>Loading...</p>';

        try {
            const response = await fetch('http://127.0.0.1:8000/api/run-model', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker })
            });

            const data = await response.json();

            if (data.error) {
                resultsBox.innerHTML = `<div class="error-box">${data.error}</div>`;
                return;
            }

            const isYears = data.income_statement;
            const isReconcile = isYears.map(y => `<td>${reconcileSummary(y.reconcile)}</td>`).join('');
            const isBody = `
                ${row('Revenue',                                        'revenue',          isYears, fmt)}
                ${row('Cost of Goods Sold',                            'cogs',             isYears, fmt)}
                ${row('Gross Profit',                                   'gross_profit',     isYears, fmt, true)}
                ${gap()}
                ${row('Selling, General and Administrative Expense',   'sga',              isYears, fmt)}
                ${row('Research and Development Expense',               'rnd',              isYears, fmt)}
                ${row('Other Operating Expenses',                       'other_opex',       isYears, fmt)}
                ${row('Total Operating Expenses',                       'total_opex',       isYears, fmt, true)}
                ${gap()}
                ${row('Operating Income (EBIT)',                        'operating_income', isYears, fmt, true)}
                ${gap()}
                ${row('Interest Income',                                'interest_income',  isYears, fmt)}
                ${row('Interest Expense',                               'interest_expense', isYears, fmt)}
                ${row('Other Income (Expense)',                         'other_income',     isYears, fmt)}
                ${row('Pretax Income',                                  'pretax_income',    isYears, fmt, true)}
                ${gap()}
                ${row('Income Tax Expense',                             'income_tax',       isYears, fmt)}
                ${row('Net Income',                                     'net_income',       isYears, fmt, true)}
                ${gap()}
                ${row('Earnings Per Share',                             'eps',              isYears, fmtEps)}
                ${row('Diluted Earnings Per Share',                     'eps_diluted',      isYears, fmtEps)}
            `;

            const cfYears = data.cash_flow;
            const cfReconcile = cfYears.map(y => `<td>${reconcileSummary(y.reconcile)}</td>`).join('');
            const cfBody = `
                ${sectionHeader('CASH FLOWS FROM OPERATING ACTIVITIES', cfYears.length)}
                ${row('Net Income',                                              'net_income',            cfYears, fmt)}
                ${row('Depreciation and Amortization',                           'depreciation',          cfYears, fmt)}
                ${row('Stock-Based Compensation',                                'stock_comp',            cfYears, fmt)}
                ${row('other adjustments',                                       'other_adjustments',     cfYears, fmt)}
                ${row('Change in Accounts Receivable',                           'change_ar',             cfYears, fmt)}
                ${row('Change in Inventory',                                     'change_inventory',      cfYears, fmt)}
                ${zeroRow('Change in Prepaid Expenses and Other Current Assets', cfYears.length)}
                ${row('Change in Accounts Payable',                              'change_ap',             cfYears, fmt)}
                ${zeroRow('Change in Accrued Expenses',                          cfYears.length)}
                ${row('Change in Other Operating activity',                      'other_wc',              cfYears, fmt)}
                ${zeroRow('change in unearned revenue',                          cfYears.length)}
                ${row('Net Cash Provided by Operating Activities',               'operating_cf',          cfYears, fmt, true)}
                ${gap()}
                ${sectionHeader('CASH FLOWS FROM INVESTING ACTIVITIES', cfYears.length)}
                ${row('Capital Expenditures',                                    'capex',                 cfYears, fmt)}
                ${zeroRow('Proceeds from Sale of Property and Equipment',        cfYears.length)}
                ${row('Acquisitions',                                            'acquisitions',          cfYears, fmt)}
                ${row('Purchases of Investments',                                'purchases_investments', cfYears, fmt)}
                ${row('Proceeds from Sale of Investments',                       'sales_investments',     cfYears, fmt)}
                ${row('Other Investing Activities',                              'other_investing',       cfYears, fmt)}
                ${zeroRow('Reclass: Investing → Financing (per CF_Reclasses)', cfYears.length)}
                ${row('Net Cash Used in Investing Activities',                   'investing_cf',          cfYears, fmt, true)}
                ${gap()}
                ${sectionHeader('CASH FLOWS FROM FINANCING ACTIVITIES', cfYears.length)}
                ${row('Proceeds from Long-Term Debt',                            'long_term_debt',        cfYears, fmt)}
                ${zeroRow('Reclass: from Investing (per CF_Reclasses)',          cfYears.length)}
                ${row('Proceeds from Short-Term Borrowings',                     'short_term_debt',       cfYears, fmt)}
                ${zeroRow('Repayments of Short-Term Borrowings',                 cfYears.length)}
                ${row('Payment of Dividends',                                    'dividends_paid',        cfYears, fmt)}
                ${row('Share Repurchases',                                       'stock_repurchased',     cfYears, fmt)}
                ${row('Issuance of Common Stock',                                'stock_issued',          cfYears, fmt)}
                ${row('Other Financing Activities',                              'other_financing',       cfYears, fmt)}
                ${row('Net Cash Provided by (Used in) Financing Activities',     'financing_cf',          cfYears, fmt, true)}
                ${gap()}
                ${row('Effect of Exchange Rate Changes',                         'fx_effect',             cfYears, fmt)}
                ${row('Net Increase (Decrease) in Cash',                         'net_change_cash',       cfYears, fmt)}
                ${row('Cash at Beginning of Period',                             'cash_beginning',        cfYears, fmt)}
                ${row('Cash at End of Period',                                   'cash_end',              cfYears, fmt)}
                ${gap()}
                ${row('Free Cash Flow',                                          'free_cash_flow',        cfYears, fmt, true)}
            `;

            const bsYears = data.balance_sheet;
            const bsReconcile = bsYears.map(y => `<td>${reconcileSummary(y.reconcile)}</td>`).join('');
            const bsBody = `
                ${sectionHeader('ASSETS', bsYears.length)}
                ${subHeader('Current Assets', bsYears.length)}
                ${row('Cash and short term investments',              'cash_st_investments',     bsYears, fmt)}
                ${row('Accounts Receivable',                          'accounts_receivable',     bsYears, fmt)}
                ${row('Inventory',                                    'inventory',               bsYears, fmt)}
                ${zeroRow('Prepaid Expenses and Other Current Assets', bsYears.length)}
                ${row('other',                                        'other_current',           bsYears, fmt)}
                ${row('Total Current Assets',                         'total_current_assets',    bsYears, fmt, true)}
                ${gap()}
                ${subHeader('Non-Current Assets', bsYears.length)}
                ${row('Property, Plant and Equipment',                'ppe_net',                 bsYears, fmt)}
                ${row('Goodwill',                                     'goodwill',                bsYears, fmt)}
                ${row('Intangible Assets',                            'intangible_assets',       bsYears, fmt)}
                ${row('Long-Term Investments',                        'lt_investments',          bsYears, fmt)}
                ${row('Other Non-Current Assets',                     'other_noncurrent',        bsYears, fmt)}
                ${row('Total Non-Current Assets',                     'total_noncurrent_assets', bsYears, fmt, true)}
                ${gap()}
                ${row('Total Assets',                                 'total_assets',            bsYears, fmt, true)}
                ${gap()}
                ${sectionHeader("LIABILITIES AND SHAREHOLDERS' EQUITY", bsYears.length)}
                ${subHeader('Current Liabilities', bsYears.length)}
                ${row('Accounts Payable',                             'accounts_payable',        bsYears, fmt)}
                ${row('Accrued Expenses',                             'accrued_expenses',        bsYears, fmt)}
                ${row('Current Portion of Long-Term Debt',            'current_ltd',             bsYears, fmt)}
                ${row('Other Current Liabilities',                    'other_current_liab',      bsYears, fmt)}
                ${row('Total Current Liabilities',                    'total_current_liab',      bsYears, fmt, true)}
                ${gap()}
                ${subHeader('Non-Current Liabilities', bsYears.length)}
                ${row('Long-Term Debt',                               'long_term_debt',          bsYears, fmt)}
                ${row('Deferred Tax Liabilities',                     'deferred_tax_liab',       bsYears, fmt)}
                ${row('Other Long-Term Liabilities',                  'other_lt_liab',           bsYears, fmt)}
                ${zeroRow('unearned revenue',                         bsYears.length)}
                ${row('Total Non-Current Liabilities',                'total_noncurrent_liab',   bsYears, fmt, true)}
                ${gap()}
                ${row('Total Liabilities',                            'total_liabilities',       bsYears, fmt, true)}
                ${gap()}
                ${subHeader("Shareholders' Equity", bsYears.length)}
                ${row('Common Stock',                                 'common_stock',            bsYears, fmt)}
                ${row('Additional Paid-In Capital',                   'apic',                    bsYears, fmt)}
                ${row('Retained Earnings',                            'retained_earnings',       bsYears, fmt)}
                ${row('Treasury Stock',                               'treasury_stock',          bsYears, fmt)}
                ${row('Accumulated Other Comprehensive Income',       'aoci',                    bsYears, fmt)}
                ${row('other',                                        'other_equity',            bsYears, fmt)}
                ${row("Total Shareholders' Equity",                   'total_equity',            bsYears, fmt, true)}
                ${gap()}
                ${row("Total Liabilities and Shareholders' Equity",   'total_lae',               bsYears, fmt, true)}
                ${gap()}
                <tr class="check-row">
                    <td>Assets - SE + Liabilities</td>
                    ${bsYears.map(y => `<td>${fmt(y.check_balance)}</td>`).join('')}
                </tr>
            `;

            resultsBox.innerHTML = `
                <div class="company-header">
                    <span class="name">${data.company_name} (${data.ticker})</span>
                    <span class="price">Price: $${data.stock_price}</span>
                </div>
                <p class="statement-label">Income Statement</p>
                ${buildTable(data.ticker, data.ticker, isYears, isBody, isReconcile)}
                <p class="statement-label">Cash Flow Statement</p>
                ${buildTable(data.ticker, data.ticker, cfYears, cfBody, cfReconcile)}
                <p class="statement-label">Balance Sheet</p>
                ${buildTable(data.ticker, data.ticker, bsYears, bsBody, bsReconcile)}
            `;
        } catch (err) {
            resultsBox.innerHTML = `<div class="error-box">Error: ${err.message}</div>`;
        }
    });
</script>
</body>
</html>
